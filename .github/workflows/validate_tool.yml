name: Validate Tool PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools.json'
      - 'template/**'
      - 'README.md'
      - 'scripts/**'
      - '.github/workflows/validate_tool.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cargo-home

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust (nightly, for cargo -Zscript)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry, git, build cache, binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ env.CARGO_HOME }}/build
          key: cargo-pr-${{ runner.os }}-nightly-${{ hashFiles('scripts/**/*.rs', 'template/**') }}
          restore-keys: |
            cargo-pr-${{ runner.os }}-nightly-
            cargo-${{ runner.os }}-nightly-

      - name: Validate curated tool data
        run: cargo +nightly -Zscript scripts/checks.rs -- --diff-base origin/main

      - name: Check README is up to date
        run: cargo +nightly -Zscript scripts/readme.rs -- --check

      - name: Auto-approve PR
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: approve
        run: cargo +nightly -Zscript scripts/check_and_comment.rs
