name: Validation and Sync

on:
  push:
    branches: [main]
    paths:
      - 'tools.json'
      - 'scripts/**'
      - 'template/**'
  schedule:
    # monthly: run full validation on the 1st at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # keep cargo-script build dir predictable for caching
  CARGO_HOME: ${{ github.workspace }}/.cargo-home

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # need history so we can diff against the previous commit on main
          fetch-depth: 2

      - name: Install Rust (nightly, for cargo -Zscript)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry, git, build cache, binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ env.CARGO_HOME }}/build
            ${{ env.CARGO_HOME }}/bin
          key: cargo-${{ runner.os }}-nightly-${{ hashFiles('scripts/**/*.rs', 'tools.json') }}
          restore-keys: |
            cargo-${{ runner.os }}-nightly-

      - name: Install cargo-binstall (prebuilt, no compile)
        uses: cargo-bins/cargo-binstall@main

      - name: Validate tools.json schema
        run: cargo +nightly -Zscript scripts/checks.rs

      # On push: only test tools added in this push (HEAD~1..HEAD).
      # On schedule / workflow_dispatch: re-test the full catalog.
      - name: Test tools (diff on push, full on schedule/dispatch)
        id: test
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            cargo +nightly -Zscript scripts/test_clients.rs -- \
              --diff HEAD~1 --output output.log
          else
            cargo +nightly -Zscript scripts/test_clients.rs -- \
              --all --output output.log
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            checks.log
            output.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Remove logs from workspace
        if: always()
        run: rm -f checks.log output.log

      # Only regenerate the README when tools.json or the template actually
      # changed (push diff). Schedule/dispatch always regenerates.
      - name: Detect README-relevant changes
        id: readme_changes
        if: github.event_name == 'push'
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -E '^(tools\.json|template/)' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate README
        if: github.event_name != 'push' || steps.readme_changes.outputs.changed == 'true'
        run: cargo +nightly -Zscript scripts/readme.rs

      - name: Commit README if changed
        if: github.event_name != 'push' || steps.readme_changes.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(readme): regenerate from tools.json [skip ci]'
          file_pattern: README.md

      # Temporarily disabled: failing the job prevents the cache from being
      # saved, so tools that need to be compiled never get cached. Re-enable
      # once cached versions are available.
      # - name: Fail job if tool tests failed
      #   if: steps.test.outcome == 'failure'
      #   run: exit 1
