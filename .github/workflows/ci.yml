name: Validate Catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools.json'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - 'template/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'tools.json'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - 'template/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/build
          key: cargo-${{ runner.os }}-${{ hashFiles('scripts/**/*.rs') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Validate catalog
        id: catalog
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            args=(--diff-base "$PR_BASE")
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base="$PUSH_BASE"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base=$(git merge-base origin/main HEAD)
            fi
            args=(--diff-base "$base")
          fi
          cargo +nightly -Zscript scripts/checks.rs -- "${args[@]}" 2>&1 | tee validation.log

      - name: Test maintenance scripts
        id: tests
        run: |
          { python3 -m unittest discover -s tests -v; } 2>&1 | tee tests.log

      - name: Check README freshness
        id: readme
        run: |
          { cargo +nightly -Zscript scripts/readme.rs -- --check; } 2>&1 | tee readme.log

      - name: Summarize validation
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CATALOG_STATUS: ${{ steps.catalog.outcome }}
          TESTS_STATUS: ${{ steps.tests.outcome }}
          README_STATUS: ${{ steps.readme.outcome }}
        run: python3 scripts/actions_summary.py catalog

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-validation-failure
          path: |
            checks.log
            validation.log
            tests.log
            readme.log
          retention-days: 14
          if-no-files-found: ignore
