name: Validate Catalog

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'tools.json'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - 'template/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'tools.json'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - 'template/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cargo-home

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust (nightly, for cargo -Zscript)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ env.CARGO_HOME }}/build
          key: cargo-${{ runner.os }}-nightly-${{ hashFiles('scripts/**/*.rs', 'template/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-nightly-

      - name: Validate curated tool data
        id: catalog
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            args=(--diff-base "$PR_BASE")
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base="$PUSH_BASE"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base=$(git merge-base origin/main HEAD)
            fi
            args=(--diff-base "$base")
          fi
          cargo +nightly -Zscript scripts/checks.rs -- "${args[@]}" 2>&1 | tee validation.log

      - name: Test maintenance scripts
        id: tests
        run: python3 -m unittest discover -s tests -v 2>&1 | tee tests.log

      - name: Check README is up to date
        id: readme
        run: cargo +nightly -Zscript scripts/readme.rs -- --check 2>&1 | tee readme.log

      - name: Summarize validation
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CATALOG_STATUS: ${{ steps.catalog.outcome }}
          TESTS_STATUS: ${{ steps.tests.outcome }}
          README_STATUS: ${{ steps.readme.outcome }}
        run: python3 scripts/actions_summary.py catalog

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-validation-failure
          path: |
            checks.log
            validation.log
            tests.log
            readme.log
          retention-days: 14
          if-no-files-found: ignore
