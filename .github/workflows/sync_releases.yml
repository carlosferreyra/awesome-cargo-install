name: Sync Release Metadata

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-metadata-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cargo-home

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install Rust (nightly, for cargo -Zscript)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ env.CARGO_HOME }}/build
          key: cargo-${{ runner.os }}-nightly-${{ hashFiles('scripts/**/*.rs', 'template/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-nightly-

      - name: Validate catalog before sync
        id: before
        run: cargo +nightly -Zscript scripts/checks.rs 2>&1 | tee before-sync.log

      - name: Fetch latest release info from crates.io
        id: metadata
        run: cargo +nightly -Zscript scripts/latest_release.rs 2>&1 | tee sync.log

      - name: Validate updated catalog
        id: after
        run: cargo +nightly -Zscript scripts/checks.rs 2>&1 | tee after-sync.log

      - name: Generate and check README
        id: readme
        run: |
          cargo +nightly -Zscript scripts/readme.rs 2>&1 | tee readme.log
          cargo +nightly -Zscript scripts/readme.rs -- --check 2>&1 | tee -a readme.log

      - name: Commit and push metadata changes
        id: publish
        shell: bash
        run: |
          if git diff --quiet -- tools.json README.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools.json README.md
          git commit -m 'chore(tools): sync latest crates.io release metadata [skip ci]'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Summarize metadata sync
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BEFORE_STATUS: ${{ steps.before.outcome }}
          METADATA_STATUS: ${{ steps.metadata.outcome }}
          AFTER_STATUS: ${{ steps.after.outcome }}
          README_STATUS: ${{ steps.readme.outcome }}
          PUBLISH_STATUS: ${{ steps.publish.outcome }}
          PUBLISHED_CHANGES: ${{ steps.publish.outputs.changed }}
        run: python3 scripts/actions_summary.py sync

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-sync-failure
          path: |
            checks.log
            before-sync.log
            sync.log
            after-sync.log
            readme.log
            tools.json
            README.md
          retention-days: 14
          if-no-files-found: ignore
